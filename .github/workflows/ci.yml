name: CI

on:
  pull_request:
    branches: [main, develop2, refactor-dev, review-code]
  push:
    branches: [main, develop2, refactor-dev, review-code]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Build project
        run: npm run build --if-present
