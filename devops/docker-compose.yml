version: "3.8"

services:
  # 🌐 Frontend (Vue.js)
  frontend:
    build:
      context: ../fixdesk-frontend
      dockerfile: ../devops/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - fixdesk_net

  # ⚙️ Backend (Node.js + Express)
  backend:
    build:
      context: ../fixdesk-backend
      dockerfile: ../devops/Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=team0root0
      - DB_NAME=fixdesk_db
    depends_on:
      - database
    networks:
      - fixdesk_net

  # Database (MySQL)
  # database:
  #   image: mysql:5.7
  #   container_name: fixdesk_mysql
  #   restart: always
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=team0root0
  #     - MYSQL_DATABASE=fixdesk_db
  #   volumes:
  #     - db_data:/var/lib/mysql
  #     - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   ports:
  #     - "3306:3306"
  #   networks:
  #     - fixdesk_net

networks:
  fixdesk_net:

volumes:
  db_data:
