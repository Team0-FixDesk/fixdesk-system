version: "3.9"

networks:
  fixdesk-network:
    driver: bridge

services:

  backend:
    build:
      context: ./fixdesk-backend
      dockerfile: Dockerfile
    container_name: fixdesk-backend-prod
    ports:
      - "8059:8059"
    environment:
      NODE_ENV: production
      PORT: 8059
      VITE_BASE: http://dekdee2.informatics.buu.ac.th:8057
      VITE_API_URL: http://dekdee2.informatics.buu.ac.th:8059
    volumes:
      - fixdesk_uploads:/app/uploads
    networks:
      - fixdesk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8059/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./fixdesk-frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: fixdesk-frontend-prod
    ports:
      - "8057:80"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE=http://dekdee2.informatics.buu.ac.th:8059
    networks:
      - fixdesk-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  fixdesk_uploads:
    driver: local
