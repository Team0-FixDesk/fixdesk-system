networks:
  fixdesk-network:
    driver: bridge
services:
  backend:
    build:
      context: ./fixdesk-backend
      dockerfile: Dockerfile
    container_name: fixdesk-backend-prod
    ports:
      - "127.0.0.1:8059:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_DATABASE}"
      DB_USER: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES: 1d
      VITE_BASE: /
      VITE_API_URL: https://demo.ninetytwotech.co.th/fixdesk-api
      LINE_CHANNEL_ACCESS_TOKEN: "${LINE_CHANNEL_ACCESS_TOKEN}"
      LINE_CHANNEL_SECRET: "${LINE_CHANNEL_SECRET}"
      LINE_GROUP_ID: "${LINE_GROUP_ID}"
    volumes:
      - fixdesk_uploads:/app/uploads
    networks:
      - fixdesk-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./fixdesk-frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_API_BASE=https://demo.ninetytwotech.co.th/fixdesk-api
    container_name: fixdesk-frontend-prod
    ports:
      - "127.0.0.1:8057:80"
    environment:
      - NODE_ENV=production
    networks:
      - fixdesk-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fixdesk-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8060:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: "3306"
      PMA_USER: "${DB_USERNAME}"
      PMA_PASSWORD: "${DB_PASSWORD}"
      PMA_ABSOLUTE_URI: https://demo.ninetytwotech.co.th/db-fixdesk/
    networks:
      - fixdesk-network

volumes:
  fixdesk_uploads:
    driver: local