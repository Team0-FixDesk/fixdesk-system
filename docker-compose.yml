version: "3.9"

services:
  backend:
    build:
      context: ./fixdesk-backend
      dockerfile: Dockerfile
    container_name: fixdesk-backend
    ports:
      - "8057:3000"     # ใช้พอร์ตที่ dekdee ให้
    env_file:
      - .env
    volumes:
      - fixdesk_uploads:/app/uploads
    restart: always
    depends_on:
      - db

  frontend:
    build:
      context: ./fixdesk-frontend
      dockerfile: Dockerfile
    container_name: fixdesk-frontend
    ports:
      - "8058:80"       # ใช้ nginx serve build แล้ว
    restart: always
    depends_on:
      - backend

  db:
    image: mariadb:10.11
    container_name: fixdesk-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fixdesk_db_data:/var/lib/mysql
    ports:
      - "8059:3306"
    restart: always

volumes:
  fixdesk_uploads:
  fixdesk_db_data:
