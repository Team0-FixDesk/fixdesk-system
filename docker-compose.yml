version: "3.9"

services:
  backend:
    build:
      context: ./fixdesk-backend
      dockerfile: Dockerfile
    container_name: fixdesk-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      # ผูกโค้ด backend จากเครื่องจริงเข้า container
      - ./fixdesk-backend:/app
      # กัน node_modules ไม่ให้ถูกทับจากเครื่องจริง
      - /app/node_modules
      # volume สำหรับไฟล์ upload
      - fixdesk_uploads:/app/uploads
    command: npx nodemon index.js   # ใช้ nodemon เพื่อ reload อัตโนมัติ
    restart: unless-stopped

  frontend:
    build:
      context: ./fixdesk-frontend
      dockerfile: Dockerfile.dev
    container_name: fixdesk-frontend
    ports:
      # พอร์ตฝั่งเครื่องจริง : พอร์ต dev server ภายใน container
      - "8080:5173"
    depends_on:
      - backend
    volumes:
      # ผูกโค้ด frontend จากเครื่องจริงเข้า container
      - ./fixdesk-frontend:/app
      # กัน node_modules ไม่ให้ถูกทับจากเครื่องจริง
      - /app/node_modules
    working_dir: /app
    command: npm run dev   # ให้รัน Vite dev server (Hot Reload)
    restart: unless-stopped

volumes:
  fixdesk_uploads:
    driver: local
